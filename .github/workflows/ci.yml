name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run FastAPI app test
      run: |
        echo "from main import app" > test.py
        echo "assert app is not None" >> test.py
        python test.py
    - name: Build Docker image
      run: docker build -t fastapi-ci-app .
